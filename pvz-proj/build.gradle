buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url 'https://jitpack.io' }
  }
  dependencies {


  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  apply plugin: 'checkstyle'
  java.sourceCompatibility = 17
  java.targetCompatibility = 17

  checkstyle {
    toolVersion = '10.17.0'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    configDirectory = rootProject.file('config/checkstyle')
    ignoreFailures = false
    maxErrors = 0
    maxWarnings = 0
    showViolations = true
  }

  tasks.named('checkstyleMain').configure {
    source = files('src/main/java')
  }
  tasks.withType(Checkstyle).configureEach {
    reports {
      xml.required = true
      html.required = true
    }
  }

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'plants-vs-zombies-failure'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'plants-vs-zombies-failure' + '-parent'

tasks.register('linter') {
  group = 'verification'
  description = 'Run Checkstyle on all modules. A perfect score is zero violations.'
  dependsOn subprojects.collect { it.path + ':checkstyleMain' }
  doLast {
    int violations = 0
    subprojects.each { project ->
      def report = project.file('build/reports/checkstyle/main.xml')
      if (!report.exists()) {
        return
      }
      def matches = (report.getText('UTF-8') =~ /<error /)
      violations += matches.size()
    }
    if (violations == 0) {
      logger.lifecycle('Linter score: 100/100')
    } else {
      throw new GradleException("Linter score: 0/100 (" + violations + " Checkstyle violation(s))")
    }
  }
}
